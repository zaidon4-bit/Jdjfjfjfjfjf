name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check central API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "::error::Add repository secret EXPO_PUBLIC_API_BASE_URL (the deployed HTTPS backend URL)."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_BASE_URL" in https://*) ;; *) echo "::error::API URL must use HTTPS."; exit 1 ;; esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:memory
      - run: npm --prefix backend run check
      - run: npm --prefix backend test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npx expo prebuild --platform android --non-interactive
      - run: cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: survey-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
